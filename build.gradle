plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration() {modId = "btwr"}
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "btwr" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.ladysnake.org/releases" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // BTWR API.
    //modImplementation("maven.modrinth:btwr-api:${project.btwr_api_version}")
    //modImplementation files("libs/btwr-api-${project.btwr_api_version}.jar")

    // BTWR: SL
    modImplementation("maven.modrinth:btwr-shared-library:${project.btwr_sl_version}")
    //modImplementation files("libs/btwr-shared-library-${project.btwr_sl_version}.jar")


    // Cloth Config
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Mod Menu
    modImplementation("com.terraformersmc:modmenu:${project.mod_menu_version}")


    // EMI
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    // Better With Time (For head drop logic compatibility)
    modCompileOnly "maven.modrinth:better-with-time:${bwt_version}"
    //modLocalRuntime "maven.modrinth:better-with-time:${bwt_version}"

    // BWT: Hardcore Tweaks (For head drop logic compatibility)
    modCompileOnly "maven.modrinth:bwt-hc-tweaks:${bwt_hct_version}"
    //modCompileOnly files("libs/bwt-hc-tweaks-${bwt_hct_version}.jar")
    //modLocalRuntime files("libs/bwt-hc-tweaks-${bwt_hct_version}.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "btwr_sl_version", project.btwr_sl_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "btwr_sl_version": project.btwr_sl_version
            }

    inputs.property "config", files("src/main/resources/btwr-core.mixins.json")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "projectName", project.name

    from("LICENSE") {
        rename { "${it}_${project.name}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.

    }

    loom {
        accessWidenerPath = file("src/main/resources/btwr-core.accesswidener")
    }
}